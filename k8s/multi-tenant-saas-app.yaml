apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multi-tenant-saas
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/backto-devops/multi-tenant-saas.git
    targetRevision: completed
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true